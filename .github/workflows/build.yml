name: Build signed APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TOOLS_VERSION: "35.0.0"
      # Optional repo secrets for a stable key (otherwise a throwaway key is generated each run):
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK parts
        run: sdkmanager "platforms;android-35" "build-tools;${BUILD_TOOLS_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release (unsigned)
        run: gradle --no-daemon assembleRelease
      - name: Zipalign, sign (v1-v4) and verify
        run: bash scripts/sign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: IsleMiner-signed
          path: |
            build/signed/IsleMiner.apk
            build/signed/IsleMiner.apk.idsig
